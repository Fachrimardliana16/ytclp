<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — YT Clipper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">

<header class="border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 backdrop-blur sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="/app.html" class="flex items-center gap-2 text-sm text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition">← Dashboard</a>
    <span class="font-bold">Profile</span>
    <div></div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
  <!-- Profile Card -->
  <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6">
    <div class="flex items-center gap-4 mb-6">
      <div id="avatar" class="w-16 h-16 rounded-2xl bg-red-500/10 text-red-500 grid place-items-center text-2xl font-bold"></div>
      <div>
        <div id="userName" class="text-xl font-bold"></div>
        <div id="userEmail" class="text-sm text-zinc-400"></div>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="p-3 bg-zinc-50 dark:bg-zinc-800/50 rounded-xl border border-zinc-200 dark:border-zinc-700">
        <div class="text-[10px] text-zinc-400 uppercase mb-1">Plan</div>
        <div id="statPlan" class="text-sm font-bold"></div>
      </div>
      <div class="p-3 bg-zinc-50 dark:bg-zinc-800/50 rounded-xl border border-zinc-200 dark:border-zinc-700">
        <div class="text-[10px] text-zinc-400 uppercase mb-1">Credits</div>
        <div id="statCredits" class="text-sm font-bold text-red-500"></div>
      </div>
      <div class="p-3 bg-zinc-50 dark:bg-zinc-800/50 rounded-xl border border-zinc-200 dark:border-zinc-700">
        <div class="text-[10px] text-zinc-400 uppercase mb-1">Used</div>
        <div id="statUsed" class="text-sm font-bold"></div>
      </div>
      <div class="p-3 bg-zinc-50 dark:bg-zinc-800/50 rounded-xl border border-zinc-200 dark:border-zinc-700">
        <div class="text-[10px] text-zinc-400 uppercase mb-1">Member Since</div>
        <div id="statSince" class="text-sm font-bold"></div>
      </div>
    </div>
  </div>

  <!-- Edit Name -->
  <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6">
    <h3 class="font-bold mb-4">Edit Profile</h3>
    <form id="editForm" class="flex gap-3">
      <input id="editName" type="text" class="flex-1 h-10 px-4 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-sm outline-none focus:ring-2 focus:ring-red-500/30 focus:border-red-500 transition" placeholder="Nama baru">
      <button type="submit" class="h-10 px-5 rounded-xl bg-red-500 text-white text-sm font-semibold hover:bg-red-600 transition">Simpan</button>
    </form>
    <div id="editMsg" class="hidden mt-2 text-sm text-green-600"></div>
  </div>

  <!-- Upgrade CTA -->
  <div class="bg-gradient-to-r from-red-500 to-orange-500 rounded-2xl p-6 text-white">
    <h3 class="font-bold text-lg mb-1">Upgrade ke Pro</h3>
    <p class="text-white/80 text-sm mb-4">100 clip/bulan, tanpa watermark, 1080p output.</p>
    <a href="#pricing" class="inline-block h-10 px-6 rounded-xl bg-white text-red-500 font-semibold hover:bg-white/90 transition text-sm">Lihat Harga</a>
  </div>

  <!-- Danger Zone -->
  <div class="bg-white dark:bg-zinc-900 border border-red-200 dark:border-red-500/20 rounded-2xl p-6">
    <h3 class="font-bold text-red-500 mb-2">Danger Zone</h3>
    <p class="text-sm text-zinc-500 mb-4">Logout dari semua perangkat.</p>
    <button onclick="logout()" class="h-9 px-4 rounded-lg border border-red-300 dark:border-red-500/30 text-red-500 text-sm font-medium hover:bg-red-50 dark:hover:bg-red-500/10 transition">Logout</button>
  </div>
</main>

<script>
const TOKEN=localStorage.getItem('token');
const USER=JSON.parse(localStorage.getItem('user')||'null');
if(!USER||!TOKEN)window.location.href='/login.html';

function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='/login.html'}
function authHeaders(){return TOKEN?{'Authorization':'Bearer '+TOKEN}:{}}

// Populate
document.getElementById('avatar').textContent=(USER.name||USER.email||'?')[0].toUpperCase();
document.getElementById('userName').textContent=USER.name||USER.email;
document.getElementById('userEmail').textContent=USER.email;
document.getElementById('statPlan').textContent=(USER.plan||'free').toUpperCase();
document.getElementById('statCredits').textContent=USER.credits;
document.getElementById('statUsed').textContent=USER.credits_used||0;
document.getElementById('statSince').textContent=new Date(USER.created_at||Date.now()).toLocaleDateString('id-ID');

// Fetch fresh data
fetch('/api/auth/me',{headers:authHeaders()}).then(r=>r.json()).then(d=>{
  if(d.id){
    document.getElementById('userName').textContent=d.name;
    document.getElementById('userEmail').textContent=d.email;
    document.getElementById('statPlan').textContent=(d.plan||'free').toUpperCase();
    document.getElementById('statCredits').textContent=d.credits;
    document.getElementById('statUsed').textContent=d.credits_used||0;
    document.getElementById('statSince').textContent=new Date(d.created_at).toLocaleDateString('id-ID');
  }
});

// Edit name
document.getElementById('editForm').onsubmit=async(e)=>{
  e.preventDefault();
  const name=document.getElementById('editName').value.trim();
  if(!name)return;
  try{
    const res=await fetch('/api/auth/me',{method:'PUT',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({name})});
    const d=await res.json();
    if(res.ok){
      USER.name=name;localStorage.setItem('user',JSON.stringify(USER));
      document.getElementById('userName').textContent=name;
      document.getElementById('editMsg').textContent='Tersimpan!';document.getElementById('editMsg').classList.remove('hidden');
      setTimeout(()=>document.getElementById('editMsg').classList.add('hidden'),2000);
    }
  }catch{}
};
</script>
</body>
</html>
