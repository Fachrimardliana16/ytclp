<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — YT Clipper</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ef4444">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#09090b;--text2:#52525b;--text3:#a1a1aa;--accent:#ef4444;--accent-hover:#dc2626;--radius:12px}
    @media(prefers-color-scheme:dark){:root{--bg:#09090b;--surface:#18181b;--border:#27272a;--text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--accent:#ef4444;--accent-hover:#dc2626}}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
    .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
    @media(prefers-color-scheme:dark){.card{box-shadow:0 4px 24px rgba(0,0,0,.4)}}
    .logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;margin:0 auto 20px}
    h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
    .subtitle{text-align:center;font-size:14px;color:var(--text2);margin-bottom:28px}
    .error{display:none;margin-bottom:16px;padding:12px;border-radius:var(--radius);background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);font-size:13px;color:var(--accent)}
    label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
    input[type="email"],input[type="password"]{width:100%;height:44px;padding:0 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .15s,box-shadow .15s}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
    .field{margin-bottom:16px}
    .btn{width:100%;height:44px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:14px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover{background:var(--accent-hover)}
    .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
    .divider{text-align:center;color:var(--text3);font-size:13px;margin:16px 0}
    .footer{text-align:center;margin-top:20px;font-size:13px;color:var(--text2)}
    .footer a{color:var(--accent);font-weight:500}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">YC</div>
    <h1>Login</h1>
    <p class="subtitle">Masuk ke akun YT Clipper</p>
    <div id="error" class="error"></div>
    <div id="googleBtn" class="btn btn-ghost" style="margin-bottom:16px">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span>Login dengan Google</span>
    </div>
    <div class="divider">atau</div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required placeholder="you@email.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" required minlength="6" placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="footer">Belum punya akun? <a href="/register.html">Daftar</a></p>
  </div>
  <script>
    document.getElementById('loginForm').onsubmit=async e=>{
      e.preventDefault();
      const errEl=document.getElementById('error');errEl.style.display='none';
      try{
        const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
        const d=await res.json();
        if(!res.ok)throw new Error(d.error);
        localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));
        // Admin redirect
        if(d.user.role==='admin') window.location.href='/admin.html';
        else window.location.href='/app.html';
      }catch(err){errEl.textContent=err.message;errEl.style.display='block'}
    };
    if(localStorage.getItem('token')){const u=JSON.parse(localStorage.getItem('user'));window.location.href=(u&&u.role==='admin')?'/admin.html':'/app.html';}

    // Google OAuth
    document.getElementById('googleBtn').onclick=async()=>{
      try{
        const google=window.google;
        if(!google?.accounts?.id){alert('Google SDK belum load. Coba refresh.');return}
        google.accounts.id.initialize({
          client_id: '<%= GOOGLE_CLIENT_ID %>',
          callback: async (resp)=>{
            try{
              const res=await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:resp.credential})});
              const d=await res.json();
              if(!res.ok)throw new Error(d.error);
              localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));
              if(d.user.role==='admin') window.location.href='/admin.html';
              else window.location.href='/app.html';
            }catch(e){document.getElementById('error').textContent=e.message;document.getElementById('error').style.display='block'}
          }
        });
        google.accounts.id.prompt();
      }catch(e){alert('Google login error: '+e.message)}
    };
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
