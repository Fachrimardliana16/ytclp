<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — YT Clipper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#fafafa;--surface:#fff;--border:#e4e4e7;--text:#09090b;--text2:#52525b;--text3:#a1a1aa;--accent:#ef4444;--accent-hover:#dc2626;--radius:12px}
    @media(prefers-color-scheme:dark){:root{--bg:#09090b;--surface:#18181b;--border:#27272a;--text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--accent:#ef4444;--accent-hover:#dc2626}}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
    .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
    @media(prefers-color-scheme:dark){.card{box-shadow:0 4px 24px rgba(0,0,0,.4)}}
    .logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;margin:0 auto 20px}
    h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
    .subtitle{text-align:center;font-size:14px;color:var(--text2);margin-bottom:28px}
    .error{display:none;margin-bottom:16px;padding:12px;border-radius:var(--radius);background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);font-size:13px;color:var(--accent)}
    label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
    input{width:100%;height:44px;padding:0 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .15s,box-shadow .15s}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
    .field{margin-bottom:16px}
    .btn{width:100%;height:44px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:14px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:background .15s}
    .btn:hover{background:var(--accent-hover)}
    .footer{text-align:center;margin-top:20px;font-size:13px;color:var(--text2)}
    .footer a{color:var(--accent);font-weight:500}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">YC</div>
    <h1>Daftar Gratis</h1>
    <p class="subtitle">10 clip/bulan, tanpa kartu kredit</p>
    <div id="error" class="error"></div>
    <form id="regForm">
      <div class="field">
        <label>Nama</label>
        <input id="name" type="text" required placeholder="Nama kamu">
      </div>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required placeholder="you@email.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" required minlength="6" placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="btn">Daftar</button>
    </form>
    <p class="footer">Sudah punya akun? <a href="/login.html">Login</a></p>
  </div>
  <script>
    document.getElementById('regForm').onsubmit=async e=>{
      e.preventDefault();
      const err=document.getElementById('error');err.style.display='none';
      try{
        const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});
        const d=await res.json();
        if(!res.ok)throw new Error(d.error);
        localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));
        window.location.href='/app.html';
      }catch(err){err.textContent=err.message;err.style.display='block'}
    };
    if(localStorage.getItem('token'))window.location.href='/app.html';
  </script>
</body>
</html>
