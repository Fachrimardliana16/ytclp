<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — YT Clipper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen grid place-items-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-red-500 text-white grid place-items-center text-lg font-bold mx-auto mb-4">YC</div>
      <h1 class="text-2xl font-bold">Daftar Gratis</h1>
      <p class="text-sm text-zinc-500 mt-1">10 clip/bulan, tanpa kartu kredit</p>
    </div>
    <div id="error" class="hidden mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-sm text-red-600"></div>
    <form id="regForm" class="space-y-4">
      <div>
        <label class="text-sm font-medium text-zinc-600 dark:text-zinc-400 mb-1 block">Nama</label>
        <input id="name" type="text" required class="w-full h-11 px-4 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-sm outline-none focus:ring-2 focus:ring-red-500/30 focus:border-red-500 transition" placeholder="Nama kamu">
      </div>
      <div>
        <label class="text-sm font-medium text-zinc-600 dark:text-zinc-400 mb-1 block">Email</label>
        <input id="email" type="email" required class="w-full h-11 px-4 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-sm outline-none focus:ring-2 focus:ring-red-500/30 focus:border-red-500 transition" placeholder="you@email.com">
      </div>
      <div>
        <label class="text-sm font-medium text-zinc-600 dark:text-zinc-400 mb-1 block">Password</label>
        <input id="password" type="password" required minlength="6" class="w-full h-11 px-4 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-sm outline-none focus:ring-2 focus:ring-red-500/30 focus:border-red-500 transition" placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="w-full h-11 rounded-xl bg-red-500 text-white font-semibold hover:bg-red-600 transition disabled:opacity-40">Daftar</button>
    </form>
    <p class="text-center text-sm text-zinc-500 mt-6">Sudah punya akun? <a href="/login.html" class="text-red-500 font-medium hover:underline">Login</a></p>
  </div>
  <script>
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ name: document.getElementById('name').value, email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/app.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    };
    if (localStorage.getItem('token')) window.location.href = '/app.html';
  </script>
</body>
</html>
