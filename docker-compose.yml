version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ytclipper
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - downloads:/app/downloads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ytclipper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
  downloads:
